name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

# Avoid overlapping release runs on rapid pushes to main.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release & Publish
    runs-on: ubuntu-latest
    steps:
      # Parses Conventional Commits since the last release. On a normal push it
      # opens/updates a release PR with the bumped version + generated CHANGELOG.
      # When that PR is merged, it tags the release and publishes release notes,
      # and `release_created` becomes true.
      #
      # The default GITHUB_TOKEN is used on purpose: tags it creates do NOT
      # trigger the tag-driven publish.yml workflow, so there is no double
      # publish. The publish therefore happens inline below.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://artifacts.itemis.cloud/repository/npm-open/'
          scope: '<@modelix>'

      - name: Set up pnpm
        if: ${{ steps.release.outputs.release_created }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install

      - name: Set up Gradle
        if: ${{ steps.release.outputs.release_created }}
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3

      # -Prelease=true makes build.gradle.kts publish the version from
      # .release-please-manifest.json verbatim (the manifest was just bumped to
      # the released version in the merged release PR), instead of a -SNAPSHOT.
      - name: Build and Publish Artifacts
        if: ${{ steps.release.outputs.release_created }}
        run: >-
          ./gradlew
          --build-cache
          build
          publish
          -PciBuild=true
          -Prelease=true
          -Partifacts.itemis.cloud.user=${{secrets.ARTIFACTS_ITEMIS_CLOUD_USER}}
          -Partifacts.itemis.cloud.pw=${{secrets.ARTIFACTS_ITEMIS_CLOUD_PW}}
          -Pgpr.user=${{ github.actor }}
          -Pgpr.key=${{ secrets.GITHUB_TOKEN }}
          -Pgpr.token=${{ secrets.GITHUB_TOKEN }}
          -Pgpr.universalkey=${{ secrets.GHP_UNIVERSAL_PUBLISH_TOKEN }}
          -Pmps.version.major=2023.3
