kotlin.daemon.jvmargs=-Xmx3G
kotlin.mpp.stability.nowarn=true
org.gradle.jvmargs=-Xmx2g "-XX:MaxMetaspaceSize=2g"
# The plugins bundle a newer Kotlin stdlib than the one shipped with MPS, because the libraries they use (e.g. Ktor) need it.
# The IntelliJ Platform Gradle Plugin would exclude it from the sandbox by default.
org.jetbrains.intellij.platform.useDefaultSandboxExclusions=false
